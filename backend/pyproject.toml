[project]
name = "plyback"
version = "2.0.0"
description = "Self-hosted Chess.com game review and account insights powered by Stockfish"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162",
    "starlette>=1.10",
    "uvicorn[standard]>=0.30",
    "chess>=1.11",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pip-audit>=2.7"]

[project.scripts]
plyback = "plyback.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: tests that talk to the real Chess.com API (run with -m live)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "SIM"]
ignore = ["S101", "S311", "S603", "S608", "B008", "SIM102", "SIM105", "SIM108", "E741", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"bench/*" = ["S"]
