name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The situation or question you have, and what you do today instead.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
