name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PLYBACK_REQUIRE_STOCKFISH: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      # Reuse compiled dependencies. Only main saves the cache, so pull requests read it without churning it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: node scripts/install_stockfish.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Select the verified engine for isolated test data directories
        run: node -e "const fs=require('node:fs'); fs.appendFileSync(process.env.GITHUB_ENV, 'PLYBACK_STOCKFISH='+fs.readFileSync('data/engine/stockfish.path','utf8').trim()+'\n')"
      - run: node --test scripts/install_stockfish.test.mjs
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --release --locked --manifest-path rust/Cargo.toml --all-targets
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: '3.12'
      # Benchmarks only record numbers for comparison, so they run on main and on demand, not on every pull request.
      - name: Reproduce baseline and native benchmarks on the same runner
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r backend/requirements-dev.txt
          mkdir -p benchmark-output
          python scripts/seed_benchmark.py benchmark-output/fixture.db
          python scripts/seed_benchmark.py benchmark-output/scale100.db --scale 100
          python backend/bench/run.py --source benchmark-output/fixture.db --scale 100 --repeat 5 --out benchmark-output/python-insights.json
          PLYBACK_INSIGHT_BENCH_SOURCE="$PWD/benchmark-output/scale100.db" PLYBACK_INSIGHT_BENCH_OUTPUT="$PWD/benchmark-output/rust-insights.json" cargo test --release --locked --manifest-path rust/Cargo.toml --test insights benchmark_insights -- --ignored --nocapture
          PLYBACK_DATA="$PWD/benchmark-output/engine-data" python backend/bench/analysis.py --out benchmark-output/python-engine.json --record benchmark-output/evaluations.json
          PLYBACK_BENCH_INPUT="$PWD/benchmark-output/evaluations.json" PLYBACK_BENCH_OUTPUT="$PWD/benchmark-output/rust-engine.json" cargo test --release --locked --manifest-path rust/Cargo.toml --test engine_review benchmark_reference_fixture_cold_and_warm -- --ignored --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        with:
          name: native-performance
          path: benchmark-output/*.json
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        if: matrix.os == 'ubuntu-latest'
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Rust dependency lock
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo audit --file rust/Cargo.lock --deny warnings

  backend:
    name: Preserved baseline (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: python scripts/install_stockfish.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint
        working-directory: backend
        run: python -m ruff check --config pyproject.toml plyback tests bench ../scripts
      - name: Test
        working-directory: backend
        run: python -m pytest -m "not live" --junitxml=test-results.xml
      - name: Audit locked dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pip-audit --disable-pip --no-deps -r backend/requirements-dev.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: backend-${{ matrix.os }}-${{ matrix.python }}
          path: backend/test-results.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit

  e2e:
    name: Setup, start and browser workflows (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Run the supported source setup on a clean checkout. Its builds are also
      # the prebuilt inputs for Playwright; do not build/install a second time.
      - name: Set up source distribution (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash setup.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Set up source distribution (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\setup.ps1
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Smoke-test source launcher (Linux)
        if: runner.os == 'Linux'
        run: node scripts/smoke_start.mjs
      - name: Smoke-test source launcher (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: node scripts/smoke_start.mjs
      - name: Install browser
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.os }}
          path: frontend/test-results/

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify hardened container
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker build --secret id=github_token,env=GITHUB_TOKEN -t plyback:ci .
          docker run -d --name plyback-ci --read-only --tmpfs /tmp --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 -e PLYBACK_PASSWORD=ci-access-password plyback:ci
          trap 'docker logs plyback-ci; docker rm -fv plyback-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8000/api/health
          curl --fail --silent http://127.0.0.1:8000/ | grep -q Plyback
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/accounts)" = 401
          curl --fail --silent -c /tmp/plyback-cookies -H 'Content-Type: application/json' -H 'X-Requested-With: plyback' -d '{"password":"ci-access-password"}' http://127.0.0.1:8000/api/auth/login
          curl --fail --silent -b /tmp/plyback-cookies http://127.0.0.1:8000/api/accounts | grep -q '\[\]'
          docker exec plyback-ci sh -c '! command -v python && ! command -v python3 && ! command -v node'
          docker exec plyback-ci plyback healthcheck
