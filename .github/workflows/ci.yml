name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --require-hashes -r backend/requirements-dev.txt
      - run: python scripts/install_stockfish.py
      - name: Lint
        working-directory: backend
        run: python -m ruff check --config pyproject.toml plyback tests bench ../scripts
      - name: Test
        working-directory: backend
        run: python -m pytest -m "not live" --junitxml=test-results.xml
      - name: Audit locked dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pip-audit --disable-pip --no-deps -r backend/requirements-dev.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: backend-${{ matrix.os }}-${{ matrix.python }}
          path: backend/test-results.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up isolated servers and browser
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r backend/requirements.txt
          .venv/bin/python scripts/install_stockfish.py
          cd frontend
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Browser workflows
        working-directory: frontend
        run: npm run e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures
          path: frontend/test-results/

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and verify hardened container
        shell: bash
        run: |
          set -euo pipefail
          docker build -t plyback:ci .
          docker run -d --name plyback-ci --read-only --tmpfs /tmp --security-opt no-new-privileges:true -p 127.0.0.1:8000:8000 -e PLYBACK_PASSWORD=ci-access-password plyback:ci
          trap 'docker logs plyback-ci; docker rm -fv plyback-ci' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q Plyback
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/accounts)" = 401
          curl --fail --silent -c /tmp/plyback-cookies -H 'Content-Type: application/json' -H 'X-Requested-With: plyback' -d '{"password":"ci-access-password"}' http://127.0.0.1:8000/api/auth/login
          curl --fail --silent -b /tmp/plyback-cookies http://127.0.0.1:8000/api/accounts | grep -q '\[\]'
