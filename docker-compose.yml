services:
  plyback:
    image: ghcr.io/klemen-r/plyback:3
    # To build from a source checkout instead, replace the line above with `build: .`
    ports:
      - "8000:8000"
    environment:
      # Initial password, needed on the first start: the server refuses network access
      # until a password is saved. Later starts use the saved one, so other compose
      # commands do not need it. Change it.
      PLYBACK_PASSWORD: ${PLYBACK_PASSWORD:-}
      # Behind an HTTPS reverse proxy, also set:
      # PLYBACK_SECURE_COOKIES: "1"
      # List published host IPs/names, including with a password:
      # PLYBACK_ALLOWED_HOSTS: "192.168.1.10,chess.example.org"
      # Trust only the proxy's actual connecting IP to separate client rate limits:
      # PLYBACK_TRUSTED_PROXIES: "172.20.0.2"
    volumes:
      - plyback-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Permit the current bounded network/database operation to finish after cancellation.
    stop_grace_period: 90s
volumes:
  plyback-data:
