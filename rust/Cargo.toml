[package]
name = "plyback"
version = "3.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
description = "Self-hosted Chess.com game review and account insights"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
hostname = "0.4"
if-addrs = "0.15"
pgn-reader = "0.29"
rand = "0.8"
regex = "1"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
scrypt = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
shakmaty = "0.30"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
chrono-tz = "0.10.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
