<!doctype html><html><head><meta charset="utf-8"><title>Plyback — round 2</title>
<link rel="stylesheet" href="pieces.css">
<style>
@font-face{font-family:GeistV;src:url(geist.woff2) format('woff2');font-weight:100 900}
*{box-sizing:border-box}
:root{--sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,Helvetica,Arial,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body{margin:0;font-family:var(--f);font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.ctl{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;padding:7px 12px;background:#202124;color:#ddd;font:12px var(--sys);flex-wrap:wrap}
.ctl button{font:inherit;padding:3px 9px;border-radius:4px;border:1px solid #555;background:#333;color:#eee;cursor:pointer}.ctl button.on{background:#eee;color:#111}
.ctl .sw{width:18px;height:18px;padding:0;border-radius:3px}
/* tokens */
[data-m=light]{--bg:#fafafa;--surface:#fff;--sub:#f4f4f5;--line:#e8e8e8;--line2:#d9d9d9;--ink:#171717;--ink2:#666;--ink3:#8f8f8f;--good:#1a7f45;--bad:#d93036;--sql:#e8ebef;--sqd:#9aa7b7}
[data-m=dark]{--bg:#0a0a0a;--surface:#111;--sub:#1a1a1a;--line:#262626;--line2:#333;--ink:#ededed;--ink2:#a1a1a1;--ink3:#707070;--good:#4fc27f;--bad:#f2555a;--sql:#d5dae1;--sqd:#7a899c}
[data-v=b][data-m=light]{--bg:#f5f5f7;--surface:#fff;--line:#e3e3e8;--ink:#1d1d1f;--ink2:#6e6e73;--ink3:#86868b}
[data-v=b][data-m=dark]{--bg:#000;--surface:#1c1c1e;--line:#2c2c2e;--ink:#f5f5f7;--ink2:#a1a1a6;--ink3:#6e6e73}
a{color:inherit;text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:13px;font-weight:500;height:32px;padding:0 13px;border-radius:var(--rb);border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}.w{color:var(--good)}.l{color:var(--bad)}
.mark rect.land{fill:var(--acc-vis)}
/* ===== A: Vercel dashboard ===== */
.A .hdr{background:var(--surface);border-bottom:1px solid var(--line)}
.A .row1{display:flex;align-items:center;gap:10px;height:56px;padding:0 24px}
.A .crumb{display:flex;align-items:center;gap:10px;font-size:14px}.A .slash{color:var(--line2);font-size:22px;font-weight:200}
.A .av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#999,#666)}
.A .tabs{display:flex;gap:2px;padding:0 16px}.A .tab{padding:10px 10px 12px;color:var(--ink2);font-size:14px;position:relative}
.A .tab.on{color:var(--ink)}.A .tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--ink)}
.A .page{max-width:1200px;margin:0 auto;padding:36px 24px}
.A h1{font-size:30px;font-weight:600;letter-spacing:-.035em;margin:0}
.A .sub{color:var(--ink2);margin-top:4px}
.A .grid4{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;background:var(--surface);margin:28px 0}
.A .grid4>div{padding:18px 20px;border-left:1px solid var(--line)}.A .grid4>div:first-child{border-left:0}
.A .lbl{font-size:13px;color:var(--ink2)}.A .val{font-size:26px;font-weight:600;letter-spacing:-.03em;margin-top:6px}
.A .cols{display:grid;grid-template-columns:1.45fr 1fr;gap:24px}
.A h2{font-size:15px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.A h2 a{font-size:13px;font-weight:400;color:var(--ink2)}
.A .list{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.A .item{display:grid;grid-template-columns:22px 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.A .item:first-child{border-top:0}
.A .dot{width:8px;height:8px;border-radius:50%}
.A .prio{display:grid;grid-template-columns:1fr auto;gap:10px;padding:13px 16px;border-top:1px solid var(--line)}.A .prio:first-child{border-top:0}
.A .bar{height:4px;border-radius:2px;background:var(--sub);margin-top:8px;overflow:hidden}.A .bar i{display:block;height:100%;background:var(--ink)}
/* ===== B: Apple web app ===== */
.B .hdr{position:sticky;top:33px;z-index:10;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.B .hin{max-width:1024px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.B .navs{display:flex;gap:26px;font-size:13px;color:var(--ink2)}.B .navs .on{color:var(--ink);font-weight:500}
.B .page{max-width:1024px;margin:0 auto;padding:44px 22px}
.B h1{font-size:40px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.B .sub{color:var(--ink2);font-size:17px;margin-top:6px}
.B .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:32px 0}
.B .tile{background:var(--surface);border-radius:18px;padding:20px 22px}
.B .lbl{font-size:13px;color:var(--ink2);font-weight:500}.B .val{font-size:32px;font-weight:600;letter-spacing:-.025em;margin-top:4px}
.B .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
.B h2{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0 0 12px}
.B .group{background:var(--surface);border-radius:18px;overflow:hidden}
.B .item{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 20px;position:relative}
.B .item+.item::before{content:"";position:absolute;left:20px;right:0;top:0;height:1px;background:var(--line)}
.B .chev{color:var(--ink3)}
.B .more{display:block;margin-top:10px;color:var(--acc-text);font-size:14px}
/* ===== C: Hybrid — Vercel structure, Apple softness, system font ===== */
.C .hdr{background:var(--bg)}
.C .row1{max-width:1160px;margin:0 auto;display:flex;align-items:center;gap:22px;height:60px;padding:0 24px}
.C .navs{display:flex;gap:4px;margin-left:12px}.C .navs a{padding:6px 12px;border-radius:999px;color:var(--ink2);font-size:14px}.C .navs a.on{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.04);font-weight:500}
.C .acct{margin-left:auto;display:flex;align-items:center;gap:8px;padding:4px 10px 4px 4px;border-radius:999px;box-shadow:0 0 0 1px var(--line);background:var(--surface);font-size:13px}
.C .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#9a9a9a,#5b5b5b)}
.C .page{max-width:1160px;margin:0 auto;padding:30px 24px 60px}
.C h1{font-size:32px;font-weight:650;letter-spacing:-.03em;margin:0}
.C .sub{color:var(--ink2);margin-top:4px}
.C .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:26px 0}
.C .tile{background:var(--surface);border-radius:14px;padding:18px 20px;box-shadow:0 0 0 1px var(--line)}
.C .lbl{font-size:13px;color:var(--ink2)}.C .val{font-size:28px;font-weight:600;letter-spacing:-.03em;margin-top:4px}
.C .cols{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}
.C h2{font-size:16px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
.C .card{background:var(--surface);border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.C table{width:100%;border-collapse:collapse}.C th{font-weight:500;color:var(--ink3);font-size:12.5px;text-align:left;padding:10px 16px}.C td{padding:11px 16px;border-top:1px solid var(--line)}
.C .r{text-align:right}
.C .prio{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}.C .prio:first-child{border-top:0}
.C .more{display:inline-block;margin-top:10px;color:var(--acc-text);font-size:13.5px;font-weight:500}
/* ===== D: Command — keyboard-first, compact, review-centric ===== */
.D .hdr{display:flex;align-items:center;gap:14px;height:48px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface)}
.D .search{flex:0 1 360px;margin:0 auto;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px;background:var(--sub);color:var(--ink3);font-size:13px}
.D .kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--ink3)}
.D .tabs{display:flex;gap:18px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--surface);font-size:13px}.D .tabs a{padding:9px 0;color:var(--ink2);border-bottom:2px solid transparent}.D .tabs a.on{color:var(--ink);border-color:var(--acc-vis)}
.D .page{display:grid;grid-template-columns:1fr 340px;min-height:calc(100vh - 130px)}
.D .mainc{padding:22px 26px}.D .aside{border-left:1px solid var(--line);background:var(--surface);padding:20px}
.D h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
.D .strip{display:flex;gap:34px;margin:18px 0 24px}.D .lbl{font-size:12px;color:var(--ink2)}.D .val{font-size:22px;font-weight:600;letter-spacing:-.02em}
.D table{width:100%;border-collapse:collapse;font-size:13px}.D th{font-weight:500;color:var(--ink3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);font-size:12px}.D td{padding:8px;border-bottom:1px solid var(--line)}
.D .r{text-align:right}.D tr.sel td{background:color-mix(in srgb,var(--acc-vis) 9%,transparent)}
.D .board{position:relative;width:100%;aspect-ratio:1;border-radius:4px;overflow:hidden;background-color:var(--sql);background-image:conic-gradient(var(--sqd) 90deg,transparent 90deg 180deg,var(--sqd) 180deg 270deg,transparent 270deg);background-size:25% 25%}
.D .board piece{position:absolute;width:12.5%;height:12.5%;background-size:cover}
.D .h2{font-size:13px;font-weight:600;margin:16px 0 6px}
</style></head><body data-v="a" data-m="light">
<div class="ctl"><b>Layout</b><button data-v="a">A · Vercel tabs</button><button data-v="b">B · Apple web</button><button data-v="c">C · Hybrid</button><button data-v="d">D · Keyboard-first</button>
<span style="width:12px"></span><b>Mode</b><button data-m="light">Light</button><button data-m="dark">Dark</button>
<span style="width:12px"></span><b>Cover color</b>
<button class="sw" data-c="#244b84" style="background:#244b84"></button><button class="sw" data-c="#0071e3" style="background:#0071e3"></button><button class="sw" data-c="#171717" style="background:#171717"></button><button class="sw" data-c="#b4402c" style="background:#b4402c"></button><button class="sw" data-c="#2f6b4f" style="background:#2f6b4f"></button><button class="sw" data-c="#a77a22" style="background:#a77a22"></button>
<input type="color" id="pick" value="#244b84" style="width:26px;height:20px;border:0;padding:0;background:none"></div>
<div id="root"></div>
<script>
const mark=(s=18)=>`<svg class="mark" width="${s}" height="${s}" viewBox="0 0 64 64"><rect x="10" y="4" width="17" height="17" rx="2.5" fill="currentColor"/><rect x="10" y="24" width="17" height="17" rx="2.5" fill="currentColor" opacity=".45"/><rect x="10" y="44" width="17" height="17" rx="2.5" fill="currentColor" opacity=".2"/><rect class="land" x="31" y="4" width="17" height="17" rx="2.5"/></svg>`;
const games=[['W','Makundi',630,'King’s Pawn Game','74.1','Nov 2'],['W','Tuchesssb',640,'Caro-Kann Defense','57.4','Nov 2'],['L','SamDenStore',665,'Caro-Kann Defense','54.5','Nov 2'],['W','gabriiellyaan',612,'Zukertort Opening','73.7','Nov 2'],['W','muu9m',627,'Three Knights Opening','67.1','Nov 2']];
const prios=[['Piece safety','0.78 hanging pieces per game · opponents 0.75',41],['Converting winning positions','38 of 52 winning positions converted',47],['Queen’s Pawn Game as White','37% score over 15 games',39]];
const metrics=[['Score','59%','118 won · 85 lost'],['Accuracy','78.4','Opponents 74.1'],['Blunders per game','1.62','Opponents 1.53'],['Blitz rating','652','<span class="w">+254</span> this month']];
const V={
a:()=>`<div class="A"><div class="hdr"><div class="row1"><span class="crumb">${mark(20)}<b style="font-weight:600">Plyback</b><span class="slash">/</span><span class="av"></span>klemen_r <span class="faint">▾</span></span><span style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="faint" style="font-size:13px">Stockfish 19 · idle</span><button class="btn">Sync</button></span></div>
<div class="tabs">${['Overview','Games','Insights','Compare','Reports','Activity','Settings'].map((t,i)=>`<a class="tab ${i?'':'on'}">${t}</a>`).join('')}</div></div>
<div class="page"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1>Overview</h1><div class="sub">205 games reviewed · Blitz 652 · Bullet 528</div></div><button class="btn p">Run full analysis</button></div>
<div class="grid4">${metrics.map(m=>`<div><div class="lbl">${m[0]}</div><div class="val num">${m[1]}</div><div class="faint" style="font-size:13px;margin-top:2px">${m[2]}</div></div>`).join('')}</div>
<div class="cols"><div><h2>Recent games <a>View all →</a></h2><div class="list">${games.map(g=>`<div class="item"><span class="dot" style="background:${g[0]=='W'?'var(--good)':'var(--bad)'}"></span><span><b style="font-weight:500">${g[1]}</b> <span class="faint">${g[2]}</span><div class="muted" style="font-size:13px">${g[3]}</div></span><span class="num">${g[4]}</span><span class="faint" style="font-size:13px">${g[5]}</span></div>`).join('')}</div></div>
<div><h2>Where to improve <a>Insights →</a></h2><div class="list">${prios.map(p=>`<div class="prio"><div><div style="font-weight:500">${p[0]}</div><div class="muted" style="font-size:13px">${p[1]}</div><div class="bar"><i style="width:${p[2]*2}%"></i></div></div><div class="num muted">${p[2]}%</div></div>`).join('')}</div></div></div></div></div>`,
b:()=>`<div class="B"><div class="hdr"><div class="hin"><span style="display:flex;align-items:center;gap:8px;font-weight:600">${mark(18)}Plyback</span><nav class="navs">${['Overview','Games','Insights','Compare','Reports'].map((t,i)=>`<a class="${i?'':'on'}">${t}</a>`).join('')}</nav><span class="muted" style="font-size:13px">klemen_r ▾</span></div></div>
<div class="page"><h1>Overview</h1><div class="sub">205 games reviewed on this Mac. Everything is up to date.</div>
<div class="tiles">${metrics.map(m=>`<div class="tile"><div class="lbl">${m[0]}</div><div class="val num">${m[1]}</div><div class="faint" style="font-size:13px">${m[2]}</div></div>`).join('')}</div>
<div class="cols"><div><h2>Recent games</h2><div class="group">${games.map(g=>`<div class="item"><span><span style="font-weight:500">${g[1]}</span> <span class="faint">${g[2]}</span><div class="muted" style="font-size:13px">${g[0]=='W'?'<span class="w">Won</span>':'<span class="l">Lost</span>'} · ${g[3]}</div></span><span class="num muted">${g[4]}</span><span class="chev">›</span></div>`).join('')}</div><a class="more">See all games ›</a></div>
<div><h2>Where to improve</h2><div class="group">${prios.map(p=>`<div class="item"><span><span style="font-weight:500">${p[0]}</span><div class="muted" style="font-size:13px">${p[1]}</div></span><span class="num muted">${p[2]}%</span><span class="chev">›</span></div>`).join('')}</div><a class="more">Open Insights ›</a></div></div></div></div>`,
c:()=>`<div class="C"><div class="hdr"><div class="row1"><span style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px">${mark(20)}Plyback</span><nav class="navs">${['Overview','Games','Insights','Compare','Reports'].map((t,i)=>`<a class="${i?'':'on'}">${t}</a>`).join('')}</nav><span class="acct"><span class="av"></span>klemen_r ▾</span></div></div>
<div class="page"><div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1>Overview</h1><div class="sub">205 games reviewed · last synced 2 minutes ago</div></div><div style="display:flex;gap:8px"><button class="btn" style="border-radius:999px">Sync</button><button class="btn p" style="border-radius:999px">Run full analysis</button></div></div>
<div class="tiles">${metrics.map(m=>`<div class="tile"><div class="lbl">${m[0]}</div><div class="val num">${m[1]}</div><div class="faint" style="font-size:13px">${m[2]}</div></div>`).join('')}</div>
<div class="cols"><div><h2>Recent games</h2><div class="card"><table><tr><th>Opponent</th><th>Opening</th><th class="r">Accuracy</th><th class="r">Date</th></tr>${games.map(g=>`<tr><td><span class="${g[0]=='W'?'w':'l'}" style="font-weight:600;margin-right:8px">${g[0]}</span>${g[1]} <span class="faint">${g[2]}</span></td><td class="muted">${g[3]}</td><td class="r num">${g[4]}</td><td class="r faint">${g[5]}</td></tr>`).join('')}</table></div><a class="more">All games →</a></div>
<div><h2>Where to improve</h2><div class="card">${prios.map(p=>`<div class="prio"><div><div style="font-weight:500">${p[0]}</div><div class="muted" style="font-size:13px">${p[1]}</div></div><div class="num muted">${p[2]}%</div></div>`).join('')}</div><a class="more">Open Insights →</a></div></div></div></div>`,
d:()=>`<div class="D"><div class="hdr"><span style="display:flex;align-items:center;gap:8px;font-weight:600">${mark(18)}Plyback</span><span class="faint">/</span><span>klemen_r ▾</span><div class="search">Search games, openings, opponents<span class="kbd">Ctrl K</span></div><button class="btn p">Run analysis</button></div>
<div class="tabs">${['Overview','Games','Insights','Compare','Reports','Activity','Settings'].map((t,i)=>`<a class="${i?'':'on'}">${t}</a>`).join('')}</div>
<div class="page"><div class="mainc"><h1>Overview</h1><div class="strip">${metrics.map(m=>`<div><div class="lbl">${m[0]}</div><div class="val num">${m[1]}</div><div class="faint" style="font-size:12px">${m[2]}</div></div>`).join('')}</div>
<table><tr><th></th><th>Opponent</th><th>Opening</th><th class="r">Accuracy</th><th class="r">Date</th></tr>${games.map((g,i)=>`<tr class="${i==2?'sel':''}"><td class="${g[0]=='W'?'w':'l'}" style="font-weight:600;width:20px">${g[0]}</td><td>${g[1]} <span class="faint">${g[2]}</span></td><td class="muted">${g[3]}</td><td class="r num">${g[4]}</td><td class="r faint">${g[5]}</td></tr>`).join('')}</table>
<div class="h2" style="margin-top:22px">Where to improve</div><table>${prios.map((p,i)=>`<tr><td class="faint" style="width:20px">${i+1}</td><td>${p[0]} <span class="muted">— ${p[1]}</span></td><td class="r num">${p[2]}%</td></tr>`).join('')}</table></div>
<div class="aside"><div class="lbl">Selected game</div><div style="font-weight:600;margin:2px 0 10px">vs SamDenStore · Lost · 54.5</div><div class="board" id="bd"></div><div class="h2">23. Qh5 — Blunder</div><div class="muted" style="font-size:13px">Leaves the knight on g5 unprotected; Bxg5 wins it. Better was Qd3.</div><div style="display:flex;gap:6px;margin-top:12px"><button class="btn">◀</button><button class="btn">▶</button><button class="btn">Open review</button></div></div></div></div>`};
function lum(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
let acc='#244b84';
function apply(){const b=document.body,dark=b.dataset.m==='dark',L=lum(acc),s=b.style;
 s.setProperty('--acc',acc);s.setProperty('--onacc',L>.4?'#111':'#fff');
 const vis=dark&&L<.12?'color-mix(in oklab, '+acc+' 45%, white)':(!dark&&L>.6?'color-mix(in oklab, '+acc+' 60%, black)':acc);
 s.setProperty('--acc-vis',vis);s.setProperty('--acc-text',vis);
 s.setProperty('--f',b.dataset.v==='a'||b.dataset.v==='d'?'GeistV, var(--sys)':'var(--sys)');s.setProperty('--rb',b.dataset.v==='b'?'999px':'6px');
